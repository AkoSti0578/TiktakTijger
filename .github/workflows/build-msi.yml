name: Bouw Windows MSI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Lessen controleren
        run: npm test

      - name: MSI bouwen
        run: npx electron-builder --win msi --x64 --publish never

      - name: MSI uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiktakTijger-MSI
          path: dist/*.msi
          if-no-files-found: error

      - name: Release maken (alleen bij een versie-tag, bijv. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.msi
